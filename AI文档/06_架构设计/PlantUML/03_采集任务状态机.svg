7 L406.82,321.267 L371.87,325.267 L406.82,329.267 L406.82,383.227 A0,0 0 0 0 406.82,383.227 L747.92,383.227 A0,0 0 0 0 747.92,383.227 L747.92,277.297 L737.92,267.297 L406.82,267.297 A0,0 0 0 0 406.82,267.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M737.92,267.297 L737.92,277.297 L747.92,277.297 L737.92,267.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="412.82" y="284.364" fill="#000" font-size="13" textLength="313.593">currentStage另存：discovering/fetching/parsing/</text><text x="412.82" y="299.497" fill="#000" font-size="13" textLength="320.1">extracting/verifying/publishing，不是taskStatus。</text><text x="412.82" y="314.629" fill="#000" font-size="13" textLength="193.788">schema合法不等于事实已验证。</text><text x="412.82" y="329.762" fill="#000" font-size="13" textLength="247">子任务错误不直接把整校所有机会标失败。</text><text x="412.82" y="344.895" fill="#000" font-size="13" textLength="234">工具调用前原子预留预算，结束后结算。</text><text x="412.82" y="360.028" fill="#000" font-size="13" textLength="239.961">发布同事务核对taskId+fencingToken+</text><text x="412.82" y="375.161" fill="#000" font-size="13" textLength="281.392">expectedCurrentVersion，过期worker拒写。</text></g><g class="entity" data-qualified-name="GMN29" id="ent0030" data-source-line="34"><path d="M679.87,718.627 L679.87,774.025 A0,0 0 0 0 679.87,774.025 L908.87,774.025 A0,0 0 0 0 908.87,774.025 L908.87,728.627 L898.87,718.627 L758.32,718.627 L658.36,653.257 L750.32,718.627 L679.87,718.627 A0,0 0 0 0 679.87,718.627" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M898.87,718.627 L898.87,728.627 L908.87,728.627 L898.87,718.627" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="685.87" y="735.694" fill="#000" font-size="13" textLength="182">终态含原因、范围、产物引用。</text><text x="685.87" y="750.827" fill="#000" font-size="13" textLength="208">后续显式新任务可引用旧产物继续；</text><text x="685.87" y="765.959" fill="#000" font-size="13" textLength="156">不在终态后隐式无限续费。</text></g><g class="entity" data-qualifi